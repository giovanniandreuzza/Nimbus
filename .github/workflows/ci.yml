name: CI

on:
  pull_request:
    # 'edited' is not a default activity type, and the title is a required
    # check that becomes the commit message on a squash merge: without it a
    # pull request can pass with a valid title and then be renamed.
    types: [opened, synchronize, reopened, edited]

# Read-only: the build job runs code from the pull request. The repository
# default is already 'read', but that is a setting someone can change.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The conventions check walks BASE_SHA..HEAD_SHA; a shallow clone has
          # no such range.
          fetch-depth: 0
      - name: Check branch, commit and pull request conventions
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-conventions.sh

  build:
    # macOS because the iOS targets do not compile anywhere else. The repository
    # is public, so these minutes are free.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build every target and run every test
        run: ./gradlew build --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
