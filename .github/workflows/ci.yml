name: CI

on:
  pull_request:

# Read-only: this workflow runs code from the pull request. The repository
# default is already 'read', but that is a setting someone can change.
#
# Everything here is defined by the pull request's own merge ref and can be
# rewritten by it. That is acceptable for a build — its job is to answer
# "does this compile", not to be a gate. The gate that cannot be rewritten is
# conventions.yml, which runs from the base branch.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # macOS because the iOS targets do not compile anywhere else. The repository
    # is public, so these minutes are free.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build every target and run every test
        run: ./gradlew build --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
