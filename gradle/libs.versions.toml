[versions]
## Kotlin
kotlin = "2.3.20"

## Desugar
desugar_jdk_libs_version = "2.1.5"

## Vanniktech-mavenPublish
vanniktech_mavenPublish_version = "0.36.0"

## KotlinX - Serialization
kotlinx_serialization_version = "1.11.0"

## KotlinX - IO
kotlinx_io_version = "0.9.0"

## Hash - SHA2
hash_sha2_version = "0.8.0"

## Android
agp = "9.1.1"
coreKtx = "1.18.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.03.01"

## Koin
koin_android_version = "4.2.1"

## Timber
timber_version = "5.0.1"

## LeakCanary
leakcanary_version = "2.14"

## Ktor
ktor_version = "3.4.2"

## Nimbus
nimbus_version = "2.0.0"

## ExplicitArchitecture
explicitarchitecture_version = "1.4.0"

## Test
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

[libraries]
## Desugar
desugar_jdk_libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar_jdk_libs_version" }

## KotlinX - Serialization
kotlinx_serialization_json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx_serialization_version" }
kotlinx_serialization_protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "kotlinx_serialization_version" }

## KotlinX - IO
kotlinx_io = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx_io_version" }

## Hash - SHA2
hash-sha2 = { module = "org.kotlincrypto.hash:sha2", version.ref = "hash_sha2_version" }

## AndroidX
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

## Koin
koin_android = { module = "io.insert-koin:koin-android", version.ref = "koin_android_version" }

## Timber
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber_version" }

## LeakCanary
leakcanary = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary_version" }

## Ktor
ktor = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor_version" }
ktor_okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor_version" }

## Nimbus
nimbus = { module = "io.github.giovanniandreuzza:nimbus", version.ref = "nimbus_version" }
nimbus_ktor = { module = "io.github.giovanniandreuzza:nimbus-ktor", version.ref = "nimbus_version" }

## ExplicitArchitecture
explicitarchitecture = { module = "io.github.giovanniandreuzza:explicitarchitecture", version.ref = "explicitarchitecture_version" }

## Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }


[plugins]
## Nimbus
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech_mavenPublish_version" }

## Android
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }